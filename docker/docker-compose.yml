version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: carbonbill-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Data Source=/data/carbonbill.db;Cache=Shared
      - ConnectionStrings__HangfireConnection=Data Source=/data/hangfire.db;Cache=Shared
      - Jwt__Key=${JWT_SECRET_KEY:-CarbonBill-ProductionSecretKey-ChangeInEnv-MustBe32BytesLong!}
      - Jwt__Issuer=CarbonBill
      - Jwt__Audience=CarbonBillClients
    volumes:
      - carbonbill-data:/data
    networks:
      - carbonbill-net
    expose:
      - "5000"

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: carbonbill-worker
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/data/carbonbill.db;Cache=Shared
      - ConnectionStrings__HangfireConnection=Data Source=/data/hangfire.db;Cache=Shared
      - HANGFIRE_WORKER_ONLY=true
    volumes:
      - carbonbill-data:/data
    networks:
      - carbonbill-net
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    container_name: carbonbill-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - carbonbill-net
    depends_on:
      - api

volumes:
  carbonbill-data:
    name: carbonbill-data
  caddy-data:
  caddy-config:

networks:
  carbonbill-net:
    driver: bridge
