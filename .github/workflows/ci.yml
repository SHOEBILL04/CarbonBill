name: CarbonBill CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-test:
    name: Backend Build & Tests (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore CarbonBill.sln

      - name: Build Solution
        run: dotnet build CarbonBill.sln --no-restore -c Release

      - name: Run Unit, Integration & Architecture Tests
        run: dotnet test CarbonBill.sln --no-build -c Release --logger "trx;LogFileName=test_results.trx"

      - name: Dependency Vulnerability Scan
        run: dotnet list CarbonBill.sln package --vulnerable --include-transitive

  frontend-build:
    name: Frontend PWA Build (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: npm install --legacy-peer-deps

      - name: Build Vite PWA & Verify Bundles
        working-directory: ./web
        run: npm run build
